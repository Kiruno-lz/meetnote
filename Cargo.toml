[workspace]
resolver = "2"
exclude = ["crates/ui"]
members = [
    "apps/meetnote",
    "crates/application",
    "crates/audio",
    "crates/asr",
    "crates/asr-sherpa-onnx",
    "crates/asr-whisper-rs",
    "crates/contracts",
    "crates/diarization",
    "crates/diarization-native",
    "crates/diarization-sherpa-onnx",
    "crates/domain",
    "crates/llm",
    "crates/models",
    "crates/persistence",
    "crates/runtime",
    "crates/settings",
    "crates/ui-text",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
futures = "0.3"
hound = "3.5"
bzip2 = "0.6"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "pcm", "wav"] }
sha2 = "=0.11.0"
tar = "0.4"
ureq = "2.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
fs2 = "0.4"
regex = "=1.13.1"
ndarray = "0.17"

[patch.crates-io]
# speakrs 0.5 keeps its inference-artifact layout private. This exact-version
# vendor patch adds one validated constructor so MeetNote can reuse the library's
# own recording-wide AHC/PLDA/VBx post-inference stage for bounded audio windows.
# CPU embedding sessions also use measured, bounded intra-op parallelism.
speakrs = { path = "third_party/speakrs" }

[profile.dev]
# macOS defaults dev builds to unpacked debuginfo: DWARF stays in loose
# target/debug/deps/*.rcgu.o files, and every incremental rebuild writes a new
# set without removing the superseded one. Packed keeps the same workspace
# debuginfo in one .dSYM per binary.
split-debuginfo = "packed"

# Dependencies are not debugged at the variable level. Panic locations do not
# come from DWARF, so test failures still report file:line.
[profile.dev.package."*"]
debug = false
