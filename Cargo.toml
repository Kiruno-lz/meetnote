[workspace]
resolver = "2"
members = [
    "apps/meetnote",
    "crates/application",
    "crates/audio",
    "crates/asr",
    "crates/asr-sherpa-onnx",
    "crates/asr-whisper-rs",
    "crates/contracts",
    "crates/diarization",
    "crates/diarization-native",
    "crates/diarization-sherpa-onnx",
    "crates/domain",
    "crates/llm",
    "crates/models",
    "crates/persistence",
    "crates/runtime",
    "crates/settings",
    "crates/ui",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
hound = "3.5"
bzip2 = "0.6"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "pcm", "wav"] }
sha2 = "0.10"
tar = "0.4"
ureq = "2.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
ndarray = "0.17"

# GPUI is still pre-1.0. Keep the UI, platform, and gpui-component crates on one
# exact revision; Cargo.lock records the resolved Zed commit.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "1081d2b272c653a90b92184521c224d1200b6f72" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "1081d2b272c653a90b92184521c224d1200b6f72" }

[patch.crates-io]
# Patch the unmaintained block 0.1.6 ABI marker until its upstream API moves to block2.
block = { path = "third_party/block" }
# speakrs 0.5 keeps its inference-artifact layout private. This exact-version
# vendor patch adds one validated constructor so MeetNote can reuse the library's
# own recording-wide AHC/PLDA/VBx post-inference stage for bounded audio windows.
speakrs = { path = "third_party/speakrs" }
