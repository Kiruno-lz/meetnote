[workspace]
resolver = "2"
members = [
    "apps/meetnote",
    "crates/application",
    "crates/audio",
    "crates/asr",
    "crates/asr-sherpa-onnx",
    "crates/asr-whisper-rs",
    "crates/contracts",
    "crates/diarization",
    "crates/diarization-native",
    "crates/diarization-sherpa-onnx",
    "crates/domain",
    "crates/llm",
    "crates/models",
    "crates/persistence",
    "crates/runtime",
    "crates/ui",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "wav"] }
sha2 = "0.10"
ureq = "2.12"

# GPUI is still pre-1.0. Keep the UI and platform crates on one exact revision.
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "38c5dd7c98b20826cf6f8da24d4116a58c3a6a75", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "38c5dd7c98b20826cf6f8da24d4116a58c3a6a75", package = "gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
