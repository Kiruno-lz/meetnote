[workspace]
resolver = "2"
members = [
    "apps/meetnote",
    "crates/application",
    "crates/audio",
    "crates/asr",
    "crates/asr-sherpa-onnx",
    "crates/asr-whisper-rs",
    "crates/contracts",
    "crates/diarization",
    "crates/diarization-native",
    "crates/diarization-sherpa-onnx",
    "crates/domain",
    "crates/llm",
    "crates/models",
    "crates/persistence",
    "crates/runtime",
    "crates/settings",
    "crates/ui",
]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
thiserror = "2"
futures = "0.3"
hound = "3.5"
bzip2 = "0.6"
symphonia = { version = "0.5", default-features = false, features = ["aac", "alac", "flac", "isomp4", "mp3", "pcm", "wav"] }
sha2 = "=0.11.0"
tar = "0.4"
ureq = "2.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
fs2 = "0.4"
regex = "=1.13.1"
ndarray = "0.17"

# GPUI is still pre-1.0. zui and its gpui-component fork are bumped together,
# only to the pair of revisions pinned in Zeron's Cargo.toml.
gpui = { git = "https://github.com/zeronsh/zui", rev = "1561532176f54262e360acbb8bc00c6fcf183975", package = "gpui", default-features = false }
gpui_platform = { git = "https://github.com/zeronsh/zui", rev = "1561532176f54262e360acbb8bc00c6fcf183975", package = "gpui_platform", default-features = false, features = ["font-kit", "runtime_shaders"] }
gpui-component-assets = { git = "https://github.com/zeronsh/gpui-component", rev = "5086ff4fb162ae97ca9d806876e7c6694ac3a81f" }
gpui-base = { git = "https://github.com/zeronsh/gpui-component", rev = "5086ff4fb162ae97ca9d806876e7c6694ac3a81f" }

[patch.crates-io]
# Patch the unmaintained block 0.1.6 ABI marker until its upstream API moves to block2.
block = { path = "third_party/block" }
# speakrs 0.5 keeps its inference-artifact layout private. This exact-version
# vendor patch adds one validated constructor so MeetNote can reuse the library's
# own recording-wide AHC/PLDA/VBx post-inference stage for bounded audio windows.
# CPU embedding sessions also use measured, bounded intra-op parallelism.
speakrs = { path = "third_party/speakrs" }

[patch."https://github.com/zeronsh/zui"]
# Branch meetnote/1561532 of Kiruno-lz/zui is zui 1561532 plus merged upstream zed
# fixes zui lacks: test windows report NotSupported for raw handles instead of
# panicking (zed 7bddd16a09). Every zui crate in Cargo.lock is patched so
# gpui-component and MeetNote resolve a single gpui.
collections = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
derive_refineable = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_linux = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_macos = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_macros = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_platform = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_shared_string = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_util = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_web = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_wgpu = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
gpui_windows = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
http_client = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
media = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
perf = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
refineable = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
scheduler = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
sum_tree = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }
util_macros = { git = "https://github.com/Kiruno-lz/zui", rev = "5d54d27579d87c6027e7699a2b9fcfffcb125b6b" }

[profile.dev]
# macOS defaults dev builds to unpacked debuginfo: DWARF stays in loose
# target/debug/deps/*.rcgu.o files, and every incremental rebuild writes a new
# set without removing the superseded one. Packed keeps the same workspace
# debuginfo in one .dSYM per binary.
split-debuginfo = "packed"

# Dependencies are not debugged at the variable level. Panic locations do not
# come from DWARF, so test failures still report file:line.
[profile.dev.package."*"]
debug = false
