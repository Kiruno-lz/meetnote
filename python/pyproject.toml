[project]
name = "meetnote-python"
version = "0.1.0"
description = "meetnote ASR Python backend"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20240930",
    "pyannote.audio>=4.0",
    "funasr",
    "qwen-asr",
    "librosa",
    "huggingface-hub",
    "transformers",
    "torch",
]

[project.optional-dependencies]
cuda = ["flash-attn>=2.7.4"]
mlx = ["mlx-qwen3-asr>=0.3.5"]

[tool.uv]
dev-dependencies = []
