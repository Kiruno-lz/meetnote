[project]
name = "meetnote-python"
version = "0.1.0"
description = "meetnote ASR Python backend"
requires-python = ">=3.10"
dependencies = [
    "openai-whisper>=20240930",
    "pyannote.audio>=4.0",
    "funasr",
    "qwen-asr",
    "librosa",
    "huggingface-hub",
    "transformers",
    "torch",
]

# flash-attn is a CUDA-only acceleration library that cannot be built on macOS
# (it requires the CUDA toolkit). MiMo and Qwen3-ASR run without it using the
# standard attention path, so it is opt-in: on a CUDA machine install with
#   uv sync --extra cuda
[project.optional-dependencies]
cuda = ["flash-attn>=2.7.4"]

[tool.uv]
dev-dependencies = []
