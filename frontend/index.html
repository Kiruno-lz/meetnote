<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>meetnote</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        font-size: 14px;
        line-height: 1.6;
      }

      #app { min-height: 100vh; }

      .app-layout {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      /* Nav */
      .nav {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 24px;
        height: 52px;
        background: #111;
        border-bottom: 1px solid #2a2a2a;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .nav-brand {
        font-weight: 700;
        font-size: 16px;
        color: #fff;
        letter-spacing: -0.02em;
      }

      .nav-links {
        display: flex;
        gap: 4px;
      }

      .nav-btn {
        background: none;
        border: none;
        color: #888;
        cursor: pointer;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
        transition: background 0.15s, color 0.15s;
      }

      .nav-btn:hover { background: #222; color: #e0e0e0; }
      .nav-btn.active { background: #2a2a2a; color: #fff; }

      /* Content */
      .content {
        flex: 1;
        padding: 24px;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
      }

      /* Section */
      .section { width: 100%; }

      .section-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }

      .section-header h2 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        color: #fff;
      }

      /* Card */
      .card {
        background: #222;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 8px;
        transition: border-color 0.15s;
      }

      .card:hover { border-color: #3a3a3a; }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.15s, opacity 0.15s;
        gap: 6px;
      }

      .btn:active { opacity: 0.8; }

      .btn-primary {
        background: #4a9eff;
        color: #fff;
      }

      .btn-primary:hover { background: #3a8ee8; }

      .btn-secondary {
        background: #2e2e2e;
        color: #e0e0e0;
        border: 1px solid #3a3a3a;
      }

      .btn-secondary:hover { background: #383838; }

      .btn-sm {
        padding: 5px 10px;
        font-size: 12px;
      }

      /* Action bar */
      .action-bar {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid #2a2a2a;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 48px 24px;
        color: #666;
        font-size: 15px;
        line-height: 1.8;
      }

      /* Meeting items */
      .meeting-title {
        font-weight: 600;
        color: #e0e0e0;
        font-size: 15px;
        margin-bottom: 2px;
      }

      .meeting-date {
        font-size: 12px;
        color: #888;
      }

      /* Progress bar */
      .progress-bar-container {
        background: #2a2a2a;
        border-radius: 99px;
        height: 8px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #4a9eff, #7b61ff);
        border-radius: 99px;
        transition: width 0.5s ease;
        width: 0%;
      }

      /* Stage steps */
      .stage-step {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        color: #555;
        font-size: 14px;
        transition: color 0.3s;
      }

      .stage-step.stage-active { color: #e0e0e0; }

      .stage-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid #444;
        flex-shrink: 0;
        transition: background 0.3s, border-color 0.3s;
      }

      .stage-dot.done {
        background: #66bb6a;
        border-color: #66bb6a;
      }

      .stage-dot.current {
        background: #4a9eff;
        border-color: #4a9eff;
        box-shadow: 0 0 6px #4a9eff88;
      }

      /* Transcript */
      .transcript-list { display: flex; flex-direction: column; gap: 12px; }

      .transcript-segment {
        padding: 10px 14px;
        background: #1e1e1e;
        border-radius: 8px;
        border-left: 3px solid #2e2e2e;
      }

      .segment-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .speaker-tag {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.03em;
      }

      .segment-time {
        font-size: 11px;
        color: #666;
        font-variant-numeric: tabular-nums;
      }

      .segment-text {
        color: #ccc;
        font-size: 14px;
        line-height: 1.6;
      }

      /* Speaker editor */
      .speaker-row-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }

      .speaker-row-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      input.speaker-rename-input,
      select.speaker-merge-select {
        background: #1a1a1a;
        border: 1px solid #3a3a3a;
        border-radius: 5px;
        color: #e0e0e0;
        padding: 6px 10px;
        font-size: 13px;
        outline: none;
        transition: border-color 0.15s;
      }

      input.speaker-rename-input:focus,
      select.speaker-merge-select:focus {
        border-color: #4a9eff;
      }

      select.speaker-merge-select {
        cursor: pointer;
      }

      /* Deverbalization split view */
      .deverb-split {
        display: grid;
        grid-template-columns: 1fr 1px 1fr;
        gap: 0;
        align-items: stretch;
      }

      .deverb-left, .deverb-right {
        padding: 0 16px;
        overflow-y: auto;
        max-height: calc(100vh - 240px);
        min-height: 300px;
      }

      .deverb-left { padding-left: 0; }
      .deverb-right {
        padding-right: 0;
        display: flex;
        flex-direction: column;
      }

      .markdown-editor-textarea {
        flex: 1;
        width: 100%;
        min-height: 0;
        height: 100%;
        background: #1a1a1a;
        color: #e0e0e0;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 12px;
        font-size: 13px;
        font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
        resize: none;
        outline: none;
        line-height: 1.6;
        transition: border-color 150ms ease-out;
      }

      .markdown-editor-textarea:focus {
        border-color: #4a9eff;
      }

      .deverb-divider {
        background: #2a2a2a;
        width: 1px;
      }

      .markdown-preview {
        font-size: 12px;
        color: #bbb;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .md-line {
        min-height: 1.4em;
        line-height: 1.4;
      }

      /* Markdown library */
      .library-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      h3 {
        margin: 0 0 8px 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
